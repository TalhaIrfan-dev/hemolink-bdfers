<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
    HemoLink icon set (Module 3.1). Simple line icons drawn for this project
    on a 24x24 grid: no icon library and no licence to track.
    Usage: <th:block th:replace="~{fragments/icons :: icon('home')}"></th:block>
    Icons are decorative (aria-hidden); always put visible text or an
    aria-label next to them.
-->
<svg th:fragment="icon(name)" class="hl-icon" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
    <th:block th:switch="${name}">
        <g th:case="'home'"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></g>
        <g th:case="'plus-square'"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></g>
        <g th:case="'plus'"><path d="M12 5v14M5 12h14"/></g>
        <g th:case="'list'"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></g>
        <g th:case="'users'"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></g>
        <g th:case="'user'"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"/></g>
        <g th:case="'bell'"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0"/></g>
        <g th:case="'settings'"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
        <g th:case="'logout'"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M16 16l4-4-4-4M20 12H9"/></g>
        <g th:case="'search'"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></g>
        <g th:case="'drop'"><path d="M12 3s-6.5 7-6.5 11.5a6.5 6.5 0 0 0 13 0C18.5 10 12 3 12 3Z"/></g>
        <g th:case="'check-circle'"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/></g>
        <g th:case="'check'"><path d="m5 12.5 4.5 4.5L19 7.5"/></g>
        <g th:case="'hourglass'"><path d="M6 3h12M6 21h12"/><path d="M7 3c0 5 5 5.5 5 9s-5 4-5 9M17 3c0 5-5 5.5-5 9s5 4 5 9"/></g>
        <g th:case="'alert'"><path d="M12 3.5 2.5 20h19L12 3.5Z"/><path d="M12 10v4.5M12 17.5v.1"/></g>
        <g th:case="'bolt'"><path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12l1-8Z"/></g>
        <g th:case="'x'"><path d="M6 6l12 12M18 6 6 18"/></g>
        <g th:case="'x-circle'"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></g>
        <g th:case="'chevron-down'"><path d="m6 9 6 6 6-6"/></g>
        <g th:case="'chevron-left'"><path d="m15 6-6 6 6 6"/></g>
        <g th:case="'chevron-right'"><path d="m9 6 6 6-6 6"/></g>
        <g th:case="'arrow-right'"><path d="M5 12h14M13 6l6 6-6 6"/></g>
        <g th:case="'arrow-up'"><path d="M12 19V5M6 11l6-6 6 6"/></g>
        <g th:case="'calendar'"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
        <g th:case="'clock'"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g>
        <g th:case="'activity'"><path d="M3 12h4l3-7 4 14 3-7h4"/></g>
        <g th:case="'chart'"><path d="M4 20V4M4 20h16"/><path d="m7 15 4-5 3 3 5-6"/></g>
        <g th:case="'heart'"><path d="M12 20s-7.5-4.6-9-9.5C1.8 6.6 4.6 4 7.5 4c2 0 3.4 1.2 4.5 2.7C13.1 5.2 14.5 4 16.5 4c2.9 0 5.7 2.6 4.5 6.5-1.5 4.9-9 9.5-9 9.5Z"/></g>
        <g th:case="'shield'"><path d="M12 3 4.5 6v6c0 4.5 3.2 7.7 7.5 9 4.3-1.3 7.5-4.5 7.5-9V6L12 3Z"/><path d="m9 12 2 2 4-4"/></g>
        <g th:case="'eye'"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></g>
        <g th:case="'eye-off'"><path d="M3 3l18 18"/><path d="M10.6 6A9.7 9.7 0 0 1 12 5.5C18 5.5 21.5 12 21.5 12a17 17 0 0 1-3 3.8M6.3 7.6A16.6 16.6 0 0 0 2.5 12S6 18.5 12 18.5a9 9 0 0 0 4.2-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></g>
        <g th:case="'clipboard'"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h4"/></g>
        <g th:case="'map-pin'"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></g>
        <g th:case="'filter'"><path d="M4 5h16l-6 7.5V19l-4 2v-8.5L4 5Z"/></g>
        <g th:case="'more'"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></g>
        <g th:case="'menu'"><path d="M4 6h16M4 12h16M4 18h16"/></g>
        <g th:case="'lock'"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></g>
        <g th:case="'mail'"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></g>
        <g th:case="'phone'"><path d="M5 3.5h3.5l1.5 4.5-2.3 1.4a11 11 0 0 0 6.9 6.9l1.4-2.3 4.5 1.5V19a1.5 1.5 0 0 1-1.6 1.5C10.5 20 4 13.5 3.5 5.1A1.5 1.5 0 0 1 5 3.5Z"/></g>
        <g th:case="'info'"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.1"/></g>
        <g th:case="'history'"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 8v4.5l3 2"/></g>
        <g th:case="'grid'"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></g>
        <g th:case="'layers'"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></g>
        <g th:case="*"><circle cx="12" cy="12" r="8"/></g>
    </th:block>
</svg>

<!-- HemoLink logo mark: a blood drop with a pulse line. -->
<svg th:fragment="logo" class="hl-logo-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
    <!-- Solid fills (no gradient ids), so the logo renders even when another
         copy of it is hidden, e.g. the auth brand panel on phones. -->
    <path d="M24 3.5S9.5 19 9.5 29a14.5 14.5 0 0 0 29 0C38.5 19 24 3.5 24 3.5Z" fill="#e0303f"/>
    <path d="M24 3.5S9.5 19 9.5 29a14.5 14.5 0 0 0 14.5 14.5V3.5Z" fill="#c81e35" opacity=".35"/>
    <path d="M15 30h5l2.5-5 3.5 10 2.5-5H33" fill="none" stroke="#fff" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
</svg>
</body>
</html>
