<!DOCTYPE html>
<!--
    Notifications (Module 3.7, FR-13, SCR-15). In-app only.
    Opening a notification marks it read and goes to the related page (POST).
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout('Notifications', 'notifications', ~{::main})}">
<body>
<main id="main" class="hl-page-content">

    <ol class="hl-breadcrumbs" aria-label="Breadcrumb">
        <li><a th:href="@{/dashboard}">Dashboard</a></li>
        <li aria-current="page">Notifications</li>
    </ol>

    <div class="hl-page-heading">
        <div>
            <h1>Notifications</h1>
            <p>Updates about your requests, matches and account.</p>
        </div>
        <div class="hl-page-heading-actions" th:if="${unreadNotificationCount > 0}">
            <form th:action="@{/notifications/read-all}" method="post">
                <button class="hl-button hl-button-secondary" type="submit">
                    <th:block th:replace="~{fragments/icons :: icon('check')}"></th:block>Mark all as read
                </button>
            </form>
        </div>
    </div>

    <th:block th:replace="~{fragments/ui :: alerts}"></th:block>

    <section class="hl-card">
        <div class="hl-card-header">
            <nav class="hl-tabs" aria-label="Filter notifications">
                <a class="hl-tab" th:href="@{/notifications}" th:classappend="${!unreadOnly} ? 'active'"
                   th:attr="aria-current=${!unreadOnly} ? 'page'">All</a>
                <a class="hl-tab" th:href="@{/notifications(unread=true)}" th:classappend="${unreadOnly} ? 'active'"
                   th:attr="aria-current=${unreadOnly} ? 'page'">
                    Unread <span class="hl-tab-count" th:text="${unreadNotificationCount}">0</span>
                </a>
            </nav>
        </div>

        <th:block th:if="${notifications.empty}">
            <th:block th:if="${unreadOnly}">
                <th:block th:replace="~{fragments/ui :: empty('check-circle', 'You are all caught up', 'You have no unread notifications.')}"></th:block>
            </th:block>
            <th:block th:unless="${unreadOnly}">
                <th:block th:replace="~{fragments/ui :: empty('bell', 'No notifications yet', 'Updates about your requests and matches will appear here.')}"></th:block>
            </th:block>
        </th:block>

        <ul class="hl-notification-list" th:unless="${notifications.empty}">
            <li th:each="n : ${notifications.content}"
                th:classappend="${!n.read} ? 'is-unread'">

                <form th:action="@{/notifications/{id}/open(id=${n.id})}" method="post">
                    <button type="submit"
                            class="hl-notification"
                            th:with="iconName=${@display.notificationIcon(n.type)}">

                        <span class="hl-notification-icon"
                            th:classappend="${@display.notificationTone(n.type)}">

                            <th:block th:replace="~{fragments/icons :: icon(${iconName})}"></th:block>
                        </span>

                        <span class="hl-notification-body">
                            <span class="hl-notification-type">
                                <span th:text="${n.typeLabel}">Type</span>
                                <span class="hl-new-badge" th:unless="${n.read}">New</span>
                            </span>

                            <span class="hl-notification-message"
                                th:text="${n.message}">Message</span>

                            <span class="hl-notification-time"
                                th:attr="title=${@display.dateTime(n.createdAt)}"
                                th:text="${@display.relative(n.createdAt)}">
                                10 minutes ago
                            </span>
                        </span>

                        <span class="hl-notification-go" aria-hidden="true">
                            <th:block th:replace="~{fragments/icons :: icon('chevron-right')}"></th:block>
                        </span>

                    </button>
                </form>
            </li>
        </ul>

        <th:block th:replace="~{fragments/ui :: pager(${notifications},
                 @{/notifications(unread=${unreadOnly}, page=${notifications.number - 1})},
                 @{/notifications(unread=${unreadOnly}, page=${notifications.number + 1})})}"></th:block>
    </section>
</main>
</body>
</html>
