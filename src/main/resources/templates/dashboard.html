<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | HemoLink</title>
</head>
<body>

<h1>Welcome to HemoLink</h1>

<p>You are successfully logged in.</p>

<ul>
    <li><a th:href="@{/donor/profile}">Create / Manage Donor Profile</a></li>
</ul>

<li>
    <a th:href="@{/donor/requests}">
        My Matched Blood Requests
    </a>
</li>

<a th:href="@{/requests/new}">Create Blood Request</a>
<br><br>
<a th:href="@{/requests}">My Blood Requests</a>

<div sec:authorize="hasRole('ADMIN')">
    <h3>Administration</h3>
    <a th:href="@{/admin/dashboard}">
        Open Admin Dashboard
    </a>
</div>


<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
