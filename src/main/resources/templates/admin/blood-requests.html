
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Request Review | HemoLink</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .review-container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 20px;
        }

        .request-card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background: white;
        }

        .request-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 18px 0;
        }

        .detail-label {
            color: #777;
            font-size: 13px;
        }

        .detail-value {
            font-weight: 600;
            margin-top: 4px;
        }

        .critical {
            color: #dc2626;
            font-weight: bold;
        }

        .normal {
            color: #2563eb;
            font-weight: bold;
        }

        .approve-btn, .reject-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            margin-right: 8px;
        }

        .approve-btn {
            background: #15803d;
        }

        .reject-btn {
            background: #dc2626;
        }

        .reason-input {
            padding: 9px;
            width: min(100%, 350px);
            margin: 8px 0;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

<div class="review-container">

    <h1>Blood Request Review</h1>
    <p>Review and approve or reject submitted blood requests.</p>

    <div th:if="${successMessage}"
         class="message success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}"
         class="message error"
         th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(bloodRequests)}">
        <p>No pending blood requests require review.</p>
    </div>

    <div th:each="request : ${bloodRequests}"
         class="request-card">

        <h3>
            Request #<span th:text="${request.id}"></span>
        </h3>

        <div class="request-details">

            <div>
                <div class="detail-label">Requester</div>
                <div class="detail-value"
                     th:text="${request.requester.fullName}"></div>
            </div>

            <div>
                <div class="detail-label">Blood Group</div>
                <div class="detail-value"
                     th:text="${request.bloodGroup}"></div>
            </div>

            <div>
                <div class="detail-label">Units Required</div>
                <div class="detail-value"
                     th:text="${request.unitsRequired}"></div>
            </div>

            <div>
                <div class="detail-label">City</div>
                <div class="detail-value"
                     th:text="${request.city}"></div>
            </div>

            <div>
                <div class="detail-label">Hospital</div>
                <div class="detail-value"
                     th:text="${request.hospitalName}"></div>
            </div>

            <div>
                <div class="detail-label">Required At</div>
                <div class="detail-value"
                     th:text="${#temporals.format(request.requiredAt, 'dd MMM yyyy HH:mm')}"></div>
            </div>

            <div>
                <div class="detail-label">Urgency</div>
                <div class="detail-value"
                     th:classappend="${request.urgency.name() == 'CRITICAL'} ? 'critical' : 'normal'"
                     th:text="${request.urgency}"></div>
            </div>

            <div>
                <div class="detail-label">Matching Status</div>
                <div class="detail-value"
                     th:text="${request.matchingStatus}"></div>
            </div>

        </div>

        <form th:action="@{/admin/blood-requests/{id}/review(id=${request.id})}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    name="decision"
                    value="APPROVED"
                    class="approve-btn">
                Approve Request
            </button>

        </form>

        <form th:action="@{/admin/blood-requests/{id}/review(id=${request.id})}"
              method="post"
              onsubmit="return confirm('Are you sure you want to reject this request?');">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden"
                   name="decision"
                   value="REJECTED">

            <input type="text"
                   name="rejectionReason"
                   class="reason-input"
                   placeholder="Reason for rejection"
                   required>

            <button type="submit" class="reject-btn">
                Reject Request
            </button>

        </form>

    </div>

    <a th:href="@{/admin/dashboard}">Back to Admin Dashboard</a>

</div>

</body>
</html>
