
# HemoLink Application Configuration

spring.application.name=HemoLink

# Activate local configuration
spring.profiles.active=local

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=never

# Server Configuration
server.port=8080

# Session Management (NFR-02: sessions expire after 30 minutes of inactivity)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Error pages (NFR-04: never expose technical details to users)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Thymeleaf
spring.thymeleaf.cache=false
