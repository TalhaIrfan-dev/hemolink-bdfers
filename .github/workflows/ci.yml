name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/hemolink_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create database schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot < database/database_schema.sql
          for f in 003_guidance_and_health_checks 004_request_review_tracking \
                   005_donor_status_history 006_notification_type 007_query_indexes; do
            mysql -h 127.0.0.1 -uroot -proot hemolink_db < database/$f.sql
          done

      - name: Build and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test
